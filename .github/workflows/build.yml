name: Сборка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  web:
    name: Интерфейс (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Собрать и опубликовать сайт
        run: |
          V="1.${{ github.run_number }}"
          APK=$(node -p "require('./package.json').version")
          mkdir -p "$RUNNER_TEMP/site"
          cp -r web/* "$RUNNER_TEMP/site/"
          sed -i "s/__WEBVER__/$V/g" "$RUNNER_TEMP/site/index.html"
          printf '{"web":"%s","apk":"%s","apkUrl":"https://github.com/%s/releases/latest/download/zadachi.apk"}\n' "$V" "$APK" "${{ github.repository }}" > "$RUNNER_TEMP/site/version.json"
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Интерфейс $V"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          cat version.json

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Нужна ли новая сборка
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(node -p "require('./package.json').version")
          echo "version=$APK" >> "$GITHUB_OUTPUT"
          if gh release view "v$APK" >/dev/null 2>&1; then echo "build=no" >> "$GITHUB_OUTPUT"; else echo "build=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.build == 'yes'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: steps.check.outputs.build == 'yes'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - if: steps.check.outputs.build == 'yes'
        name: Сборка APK
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          npm install
          npx cap sync android
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; export KS_FILE="$RUNNER_TEMP/release.jks"; fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/zadachi.apk"
      - if: steps.check.outputs.build == 'yes'
        name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.check.outputs.version }}" zadachi.apk --title "Задачи команды ${{ steps.check.outputs.version }}" --notes "Установите APK поверх старой версии — данные сохранятся."
