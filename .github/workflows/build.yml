name: Сборка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  web:
    name: Интерфейс (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт
        run: |
          V="1.${{ github.run_number }}"
          APK=$(node -p "require('./package.json').version")
          mkdir -p site
          cp -r web/* site/
          sed -i "s/__WEBVER__/$V/g" site/index.html
          printf '{"web":"%s","apk":"%s","apkUrl":"https://github.com/%s/releases/latest/download/zadachi.apk"}\n' "$V" "$APK" "${{ github.repository }}" > site/version.json
          cat site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Нужна ли новая сборка
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(node -p "require('./package.json').version")
          echo "version=$APK" >> "$GITHUB_OUTPUT"
          if gh release view "v$APK" >/dev/null 2>&1; then echo "build=no" >> "$GITHUB_OUTPUT"; else echo "build=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.build == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.build == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.check.outputs.build == 'yes'
        name: Сборка APK
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          npm install
          npx cap sync android
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; export KS_FILE="$RUNNER_TEMP/release.jks"; fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/zadachi.apk"
      - if: steps.check.outputs.build == 'yes'
        name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.check.outputs.version }}" zadachi.apk --title "Задачи команды ${{ steps.check.outputs.version }}" --notes "Установите APK поверх старой версии — данные сохранятся."
